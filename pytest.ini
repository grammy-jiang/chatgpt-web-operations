[pytest]
testpaths = tests
markers =
    live_read: T1 — GET only, the real account; needs CHATGPT_LIVE=read
    live_write: T2 — writes inside the sandbox project; needs CHATGPT_LIVE=write
    live_browser: T3 — one Chrome window on the sandbox, never sends; needs CHATGPT_LIVE=browser
    live_send: T4 — real sends inside the sandbox, cleaned up; needs CHATGPT_LIVE=send
    replay: R — recorded pages (tests/fixtures/dom) in a real headless Chrome, loopback only; run by make replay, excluded from make test
    loopback: L — the real HTTP client (urllib, retries, ladders, a synthetic cookie jar) against a fake chatgpt.com on 127.0.0.1; run by make loopback, excluded from make test
